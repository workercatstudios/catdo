[workspace]
members = ["crates/catdo-core", "apps/desktop"]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.2.2"
publish = false
license = "PolyForm-Noncommercial-1.0.0"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.dev]
debug = 0

[profile.test]
debug = 0

[profile.release]
strip = true
