[workspace]
members = ["crates/catdo-core", "apps/desktop"]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.2.12"
publish = false
license = "PolyForm-Noncommercial-1.0.0"

[workspace.dependencies]
anyhow = "=1.0.104"
chrono = { version = "=0.4.45", features = ["serde"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
uuid = { version = "=1.26.1", features = ["v4", "serde"] }

[profile.dev]
debug = 0

[profile.test]
debug = 0

[profile.release]
strip = true
