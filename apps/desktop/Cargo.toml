[package]
name = "catdo-desktop"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "catdo"
path = "src/main.rs"

[dependencies]
catdo-core = { path = "../../crates/catdo-core" }
anyhow.workspace = true
chrono.workspace = true
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true
gpui-kit = "=0.6.6"
directories = "=6.0.0"
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
keyring = { version = "=3.6.3", features = ["sync-secret-service", "crypto-rust", "windows-native"] }
semver = "=1.0.28"
sha2 = "=0.10.9"
tempfile = "=3.27.0"
flate2 = "=1.1.10"
tar = "=0.4.46"
image = { version = "=0.25.10", default-features = false, features = ["png"] }
async-channel = "=2.5.0"
tungstenite = { version = "=0.28.0", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }

[target.'cfg(not(windows))'.dependencies]
ksni = { version = "=0.3.6", default-features = false, features = ["async-io"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "=3.0.11"
image = { version = "=0.25.10", default-features = false, features = ["png", "ico"] }

[dev-dependencies]
gpui-kit = { version = "=0.6.6", features = ["test-support"] }
