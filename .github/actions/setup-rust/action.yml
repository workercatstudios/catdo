name: Set up Rust on Linux
description: Install CatDo's native build dependencies and pinned Rust toolchain.
runs:
  using: composite
  steps:
    - name: Install native dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends \
          build-essential clang cmake pkg-config patchelf \
          libdbus-1-dev libfontconfig1-dev libfreetype6-dev \
          libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev \
          libssl-dev libzstd-dev libvulkan1
    - name: Install pinned Rust toolchain
      shell: bash
      run: rustup show
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        save-if: ${{ github.ref == 'refs/heads/main' }}
